; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -Os                          ; optimise for binary size instead of speed
    -DARDUINO_USB_MODE=1         ; use ESP32-C3 native USB (GPIO18/19) for Serial
    -DARDUINO_USB_CDC_ON_BOOT=1  ; frees GPIO21 (UART0 TX) for use as COL_PINS[1]

; Only compile the one font file that ui.cpp actually uses.
; All other *.c files in src/ were experimental and add ~80-120 KB of flash for nothing.
build_src_filter =
    +<*>
    -<departure_mono_upper_40.c>
    -<dots_28.c>
    -<dots_30.c>
    -<dots_32.c>
    -<monogram_lower_32.c>
    -<monogram_lower_40.c>
    -<monogram_lower_counter_100.c>
    -<monogram_lower_counter_125.c>
    -<monogram_lower_counter_150.c>
    -<monogram_lower_numbers_58.c>
    -<monogram_lower_numbers_72.c>
    -<tecnica_55_40.c>
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0   ; lighter BLE stack than Bluedroid (~60-100 KB heap savings)
    lvgl/lvgl@^8.3.11
    moononournation/GFX Library for Arduino@^1.4.9
    mathertel/RotaryEncoder@^1.5.3
